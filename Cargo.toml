[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Pedro Buture <pedrobuture@gmail.com>"]
repository = "https://github.com/pedrobuture-ship-it/ButureCode"
publish = false

[workspace.dependencies]
egui = { version = "=0.33.3", default-features = false, features = ["default_fonts"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
